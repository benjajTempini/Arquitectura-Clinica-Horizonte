version: '3.8'

services:
  database:
    image: postgres:17-alpine
    container_name: clinica_horizonte_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Solo accesible localmente en el host para evitar exposición pública en EC2
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./clinica-horizonte-api
      dockerfile: Dockerfile
    container_name: clinica_horizonte_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
      SWAGGER_ENABLED: ${SWAGGER_ENABLED}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP}
    expose:
      - "3000"
    ports:
      # Expuesto solo en localhost; Nginx gestiona el tráfico público en los puertos 80/443
      - "127.0.0.1:${BACKEND_PORT}:3000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./clinica-horizonte-app
      dockerfile: Dockerfile
    container_name: clinica_horizonte_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      API_URL: http://backend:3000
      PUBLIC_API_URL: ${PUBLIC_API_URL}
    expose:
      - "4321"
    ports:
      # Expuesto solo en localhost; Nginx gestiona el tráfico público en los puertos 80/443
      - "127.0.0.1:${FRONTEND_PORT}:4321"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: clinica_horizonte_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # Recarga periódica automática (cada 24h) para aplicar certificados renovados sin interrumpir
    command: '/bin/sh -c ''while :; do sleep 24h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot:latest
    container_name: clinica_horizonte_certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Intenta renovar automáticamente certificados cada 12 horas en segundo plano
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  migration:
    build:
      context: ./migration
      dockerfile: Dockerfile
    container_name: clinica_horizonte_migration
    profiles: ["migration"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: clinica_horizonte_network
