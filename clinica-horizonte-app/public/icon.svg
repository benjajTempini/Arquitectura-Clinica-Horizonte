<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Fondo blanco con bordes redondeados (puedes cambiar fill a "none" si lo quieres transparente) -->
  <rect width="40" height="40" fill="#ffffff" rx="8"/>
  
  <!-- Círculo principal -->
  <circle cx="20" cy="20" r="16" fill="none" stroke="#7FFFD4" stroke-width="2.5"/>
  
  <!-- Horizonte (línea curva) -->
  <path d="M 10 24 Q 20 15 30 24" fill="none" stroke="#7FFFD4" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Cruz médica como un sol naciente -->
  <rect x="18" y="10" width="4" height="8" fill="#7FFFD4" rx="1"/>
  <rect x="16" y="12" width="8" height="4" fill="#7FFFD4" rx="1"/>
</svg>
